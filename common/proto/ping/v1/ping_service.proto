syntax = "proto3";

package ping.v1;

option go_package = "github.com/minhnbnt/uptime-monitor-microservices/common/proto/generated/ping/v1;pingv1";

message PingRequest {
  string namespace = 1;
  string kind = 2;
  string object_id = 3;
  string container_name = 4;
  int64 timeout_ms = 5;
}

message PingResponse {
  bool running = 1;
  string error = 2;
}

service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

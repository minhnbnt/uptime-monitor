openapi: "3.0.3"
info:
  title: OnTime Service API
  description: Server ontime (uptime) statistics service
  version: 1.0.0

servers:
  - url: http://localhost:8084
    description: Development server

paths:
  /api/v1/servers/ontime:
    get:
      operationId: listServersOntime
      summary: List servers with ontime stats
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerOntimeListResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/ontime/statuses:
    post:
      operationId: getServersStatuses
      summary: Get latest status for multiple servers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerStatusesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatusesResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/ontime/by-ids:
    post:
      operationId: listServersOntimeByIDs
      summary: List ontime stats for given server ids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerOntimeByIDsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerOntimeListResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/{id}:
    get:
      operationId: getServerOntime
      summary: Get server with ontime stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerOntimeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/count:
    get:
      operationId: countServersByStatus
      summary: Count servers by status for the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCountResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/{id}/uptime:
    post:
      operationId: calculateUptime
      summary: Calculate uptime for a time range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateUptimeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    OntimeStats:
      type: object
      properties:
        date:
          type: string
          format: date-time
        stats:
          type: number
          format: double
        has_data:
          type: boolean
        unknown_seconds:
          type: number
          format: double

    ServerOntime:
      type: object
      properties:
        server_id:
          type: integer
        ontime_stats:
          type: array
          items:
            $ref: "#/components/schemas/OntimeStats"

    ServerOntimeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServerOntime"

    ServerOntimeByIDsRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer

    ServerOntimeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ServerOntime"

    ServerStatusesRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer

    ServerStatusItem:
      type: object
      required:
        - server_id
        - status
      properties:
        server_id:
          type: integer
        status:
          type: string

    ServerStatusesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServerStatusItem"

    ServerCountResponse:
      type: object
      properties:
        total:
          type: integer
        online:
          type: integer
        offline:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    CalculateUptimeRequest:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        resolution:
          type: string
          description: Go duration string (e.g., "15m", "1h"), minimum 1 minute

    UptimeResponse:
      type: object
      properties:
        server_id:
          type: integer
        uptime:
          type: number
          format: double
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        total_seconds:
          type: number
          format: double
        online_seconds:
          type: number
          format: double
        has_data:
          type: boolean
        partial:
          type: boolean
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/IntervalResult"

    IntervalResult:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        uptime:
          type: number
          format: double
        has_data:
          type: boolean

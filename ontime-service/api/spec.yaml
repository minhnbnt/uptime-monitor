openapi: "3.0.3"
info:
  title: OnTime Service API
  description: Server ontime (uptime) statistics service
  version: 1.0.0

servers:
  - url: http://localhost:8084
    description: Development server

paths:
  /api/v1/servers/ontime:
    get:
      operationId: listServersOntime
      summary: List servers with ontime stats
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerOntimeListResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/{id}:
    get:
      operationId: getServerOntime
      summary: Get server with ontime stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerOntimeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/servers/{id}/uptime/calculate:
    post:
      operationId: calculateUptime
      summary: Calculate uptime for a time range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateUptimeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UptimeResponse"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    OntimeStats:
      type: object
      properties:
        date:
          type: string
          format: date-time
        stats:
          type: number
          format: double

    ServerOntime:
      type: object
      properties:
        server_id:
          type: integer
        ontime_stats:
          type: array
          items:
            $ref: "#/components/schemas/OntimeStats"

    ServerOntimeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServerOntime"

    ServerOntimeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ServerOntime"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    CalculateUptimeRequest:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        resolution:
          type: string
          description: Go duration string (e.g., "15m", "1h"), minimum 1 minute

    UptimeResponse:
      type: object
      properties:
        server_id:
          type: integer
        uptime:
          type: number
          format: double
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        total_seconds:
          type: number
          format: double
        online_seconds:
          type: number
          format: double
        intervals:
          type: array
          items:
            $ref: "#/components/schemas/IntervalResult"

    IntervalResult:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        uptime:
          type: number
          format: double

{{- if .Values.gateway.enabled }}
{{- $ns := include "uptime-monitor.namespace" . -}}
{{- range $name, $app := .Values.apps }}
{{- range $i, $path := $app.ingress }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}-{{ $i }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $name }}
spec:
  parentRefs:
    - name: uptime-monitor
      sectionName: web
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $app.port }}
{{- end }}
{{- end }}
{{- if .Values.gotrue.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gotrue
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: gotrue
spec:
  parentRefs:
    - name: uptime-monitor
      sectionName: web
      kind: Gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: ""
      backendRefs:
        - name: gotrue
          port: {{ .Values.gotrue.port }}
{{- end }}
{{- end }}

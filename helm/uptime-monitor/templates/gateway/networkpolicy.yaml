{{- if .Values.gateway.enabled }}
{{- $ns := include "uptime-monitor.namespace" . -}}
{{- range $name, $app := .Values.apps }}
{{- if $app.ingress }}
---
# Traffic from the Cilium Gateway API listener arrives with the special
# "ingress" identity, not as a pod in this namespace, so a plain
# networking.k8s.io/v1 NetworkPolicy (podSelector-based) cannot allow it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}-allow-gateway
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "{{ $app.port }}"
              protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.gotrue.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gotrue-allow-gateway
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gotrue
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "{{ .Values.gotrue.port }}"
              protocol: TCP
          # Cilium L7 is allow-list: only signup/login/token/user/logout are
          # exposed to the internet. GoTrue's Admin API (/admin/*) and
          # everything else stay reachable only in-cluster (notification-service).
          rules:
            http:
              - method: POST
                path: /signup
              - method: POST
                path: /token
              - method: GET
                path: /user
              - method: PUT
                path: /user
              - method: PATCH
                path: /user
              - method: POST
                path: /logout
{{- end }}
{{- end }}

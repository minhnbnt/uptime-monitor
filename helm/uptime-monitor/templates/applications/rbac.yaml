{{- $ns := include "uptime-monitor.namespace" . -}}
{{- if index .Values.apps "ping-service" "enabled" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ping-service
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ping-service
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ping-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ping-service
subjects:
  - kind: ServiceAccount
    name: ping-service
    namespace: {{ $ns }}
{{- end }}

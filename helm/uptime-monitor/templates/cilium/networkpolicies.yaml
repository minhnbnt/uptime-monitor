        protocol: TCP
      rules:
        http: [{}]

---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: traefik
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
  - fromEntities:
    - world
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: uptime-monitor

{{- end }}

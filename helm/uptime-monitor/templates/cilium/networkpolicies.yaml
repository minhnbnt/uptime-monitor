spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: traefik
    toPorts:
    - ports:
      - port: "{{ index .Values.apps "notification-service" "port" }}"
        protocol: TCP
      rules:
        http: [{}]
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: traefik

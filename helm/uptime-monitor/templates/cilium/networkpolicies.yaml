      - port: "6379"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: server-service
    toPorts:
    - ports:
      - port: "{{ index .Values.apps "server-service" "grpcPort" }}"
        protocol: TCP
      rules:
        http: [{}]

---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: importer-service
  namespace: {{ $ns }}
spec:
  endpointSelector:

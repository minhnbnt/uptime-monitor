    - matchLabels:
        app.kubernetes.io/name: ping-service
    - matchLabels:
        app.kubernetes.io/name: server-service
    toPorts:
    - ports:
      - port: "{{ index .Values.apps "ontime-service" "grpcPort" }}"
        protocol: TCP
      rules:
        http: [{}]
  egress:

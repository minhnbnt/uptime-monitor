{{- $ns := include "uptime-monitor.namespace" . -}}
{{- $gotrue := .Values.gotrue }}
{{- if $gotrue.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: gotrue
    app.kubernetes.io/part-of: uptime-monitor
spec:
  selector:
    app.kubernetes.io/name: gotrue
  ports:
    - name: http
      port: {{ $gotrue.port }}
      targetPort: http
{{- end }}

        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: {{ index .Values.apps "notification-service" "port" }}
      protocol: TCP
  egress:
  - to:
    - ipBlock:
        cidr: {{ $ext }}/32
    ports:
    - port: 6432
      protocol: TCP
    - port: 7233
      protocol: TCP
    - port: 1025
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gotrue
    ports:
    - port: 9999
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: server-service
    ports:
    - port: {{ index .Values.apps "server-service" "grpcPort" }}

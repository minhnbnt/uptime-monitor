  # service has no other pod-to-pod ingress.
  ingress: []
  egress:
  - to:
    - ipBlock:
        cidr: {{ $ext }}/32
    ports:
    - port: 6432
      protocol: TCP
    - port: 7233
      protocol: TCP
    - port: 1025
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gotrue
    ports:
    - port: 9999
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:

global:
  externalHost: 192.168.122.1
  image:
    registry: ghcr.io/minhnbnt/uptime-monitor
    tag: latest
    pullPolicy: Always

namespace: uptime-monitor

traefik:
  enabled: true
  image: ghcr.io/traefik/traefik:3.7
  pullPolicy: Always
  httpPort: 8080
  adminPort: 8081
  serviceType: NodePort

cors:
  allowOrigins:
    - http://localhost:5173
  allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowHeaders:
    - "*"
  maxAge: 86400
  allowCredentials: true

infra:
  postgres:
    enabled: true
    address: 192.168.122.1
    port: 5432
  pgbouncer:
    enabled: true
    address: 192.168.122.1
    port: 6432
  redis:
    enabled: true
    address: 192.168.122.1
    port: 6379
  temporal:
    enabled: true
    address: 192.168.122.1
    port: 7233
  mailpit:
    enabled: true
    address: 192.168.122.1
    port: 1025

gotrue:
  enabled: true
  image: ghcr.io/supabase/gotrue:v2.194.0
  port: 9999
  siteUrl: http://localhost:3000

apps:
  server-service:
    enabled: true
    port: 8080
    grpcPort: 50051
    replicas: 1
    serviceAccountName: server-service
    ingress:
      - /api/v1/servers
      - /api/v1/test-endpoint
    config:
      db:
        host: pgbouncer.uptime-monitor.svc.cluster.local
        port: 6432
        user: server
        dbname: server
      redis:
        addr: redis.uptime-monitor.svc.cluster.local:6379
        db: 0
      grpc:
        ping_addr: ping-service-grpc.uptime-monitor.svc.cluster.local:50053
        event_addr: ontime-service-grpc.uptime-monitor.svc.cluster.local:50052
      auth:
        issuer: http://gotrue.uptime-monitor.svc.cluster.local:9999
      log:
        level: info

  ping-service:
    enabled: true
    port: 8083
    grpcPort: 50053
    replicas: 2
    serviceAccountName: ping-service
    ingress: []
    config:
      server:
        port: 8083
      grpc:
        port: "50053"
        server_addr: server-service-grpc.uptime-monitor.svc.cluster.local:50051
        event_addr: ontime-service-grpc.uptime-monitor.svc.cluster.local:50052
      redis:
        addr: redis.uptime-monitor.svc.cluster.local:6379
        db: 0
        scheduler_shards: 10
        scheduler_claim_limit: 50
      scheduler:
        backend: redis
      log:
        level: info

  ontime-service:
    enabled: true
    port: 8084
    grpcPort: 50052
    replicas: 1
    ingress:
      - /api/v1/servers/ontime
    config:
      server:
        port: 8084
      grpc:
        port: 50052
        server_addr: server-service-grpc.uptime-monitor.svc.cluster.local:50051
      db:
        host: pgbouncer.uptime-monitor.svc.cluster.local
        port: 6432
        user: analytics
        dbname: analytics
      redis:
        addr: redis.uptime-monitor.svc.cluster.local:6379
        db: 0
        password: ""
      auth:
        issuer: http://gotrue.uptime-monitor.svc.cluster.local:9999
      log:
        level: info

  importer-service:
    enabled: true
    port: 8086
    grpcPort:
    replicas: 1
    ingress:
      - /api/v1/servers/import
      - /api/v1/servers/export
    config:
      server:
        port: 8086
      grpc:
        server_addr: server-service-grpc.uptime-monitor.svc.cluster.local:50051
      auth:
        issuer: http://gotrue.uptime-monitor.svc.cluster.local:9999
      log:
        level: info

  notification-service:
    enabled: true
    port: 8085
    replicas: 1
    ingress:
      - /api/v1/notifications
    config:
      server:
        port: 8085
      grpc:
        server_addr: server-service-grpc.uptime-monitor.svc.cluster.local:50051
        event_addr: ontime-service-grpc.uptime-monitor.svc.cluster.local:50052
      temporal:
        host: temporal.uptime-monitor.svc.cluster.local:7233
        task_queue: digest-task-queue
        workflow_name: send-report
        digest_task_queue: digest-task-queue
      mail:
        smtp_host: mailpit.uptime-monitor.svc.cluster.local
        smtp_port: 1025
        from_address: noreply@uptime-monitor.local
        disable_security: true
        tls_insecure_skip_verify: false
      auth:
        issuer: http://gotrue.uptime-monitor.svc.cluster.local:9999
        service_token: CHANGE_ME
      digest:
        max_records: 10000
      log:
        level: debug

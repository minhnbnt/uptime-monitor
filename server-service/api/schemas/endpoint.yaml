TestEndpointRequest:
  type: object
  required:
    - namespace
    - object_id
    - kind
  properties:
    namespace:
      type: string
      minLength: 1
    object_id:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
    container_name:
      type: string
      description: Optional container name for multi-container pods
    timeout:
      type: integer
      minimum: 1
      default: 10
      description: Timeout in seconds (default 10)

TestEndpointResponse:
  type: object
  required:
    - running
  properties:
    running:
      type: boolean
    error:
      type: string

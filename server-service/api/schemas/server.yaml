ServerObject:
  type: object
  required:
    - id
    - name
    - namespace
    - kind
    - object_id
    - created_at
    - updated_at
  properties:
    id:
      type: integer
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
    object_id:
      type: string
      minLength: 1
    container_name:
      type: string
    monitor_status:
      type: string
      enum:
        - "ON"
        - "OFF"
      nullable: true
    interval:
      type: integer
      minimum: 1
      description: Interval in seconds (default 30)
    timeout:
      type: integer
      minimum: 1
      description: Timeout in seconds (default 10)
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateServerRequest:
  type: object
  required:
    - name
    - namespace
    - kind
    - object_id
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
    object_id:
      type: string
      minLength: 1
    container_name:
      type: string
    interval:
      type: integer
      minimum: 1
      description: Interval in seconds (default 30)
    timeout:
      type: integer
      minimum: 1
      description: Timeout in seconds (default 10)

UpdateServerRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
    object_id:
      type: string
    container_name:
      type: string
    interval:
      type: integer
      minimum: 1
    timeout:
      type: integer
      minimum: 1

ServerResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: "#/ServerObject"

ServerListResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: "#/ServerObject"
    meta:
      $ref: "./common.yaml#/PaginationMeta"

ServerCountResponse:
  type: object
  required:
    - total
    - online
    - offline
  properties:
    total:
      type: integer
    online:
      type: integer
    offline:
      type: integer

ServerObject:
  type: object
  required:
    - id
    - name
    - namespace
    - kind
    - object_id
    - created_at
    - updated_at
  properties:
    id:
      type: integer
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
        - Service
    object_id:
      type: string
      minLength: 1
    container_name:
      type: string
    managed:
      type: boolean
      description: Whether the backing k8s object was created by this system
    monitor_status:
      type: string
      enum:
        - "ON"
        - "OFF"
      nullable: true
    interval:
      type: integer
      minimum: 1
      description: Interval in seconds (default 30)
    timeout:
      type: integer
      minimum: 1
      description: Timeout in seconds (default 10)
    http_config:
      type: object
      nullable: true
      properties:
        port:
          type: integer
          minimum: 1
        endpoint_path:
          type: string
        expected_code:
          type: integer
          minimum: 100
          maximum: 599
        body_check_expr:
          type: string
        method:
          type: string
          default: GET
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

CreateServerRequest:
  type: object
  required:
    - name
    - namespace
    - kind
    - object_id
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
      minLength: 1
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
        - Service
    object_id:
      type: string
      minLength: 1
    container_name:
      type: string
    interval:
      type: integer
      minimum: 1
      description: Interval in seconds (default 30)
    timeout:
      type: integer
      minimum: 1
      description: Timeout in seconds (default 10)
    http_config:
      type: object
      properties:
        port:
          type: integer
          minimum: 1
        endpoint_path:
          type: string
        expected_code:
          type: integer
          minimum: 100
          maximum: 599
        body_check_expr:
          type: string
        method:
          type: string
          default: GET

UpdateServerRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
    namespace:
      type: string
    kind:
      type: string
      enum:
        - Pod
        - Deployment
        - StatefulSet
        - DaemonSet
        - ReplicaSet
        - Service
    object_id:
      type: string
    container_name:
      type: string
    interval:
      type: integer
      minimum: 1
    timeout:
      type: integer
      minimum: 1
    http_config:
      type: object
      nullable: true
      properties:
        port:
          type: integer
          minimum: 1
        endpoint_path:
          type: string
        expected_code:
          type: integer
          minimum: 100
          maximum: 599
        body_check_expr:
          type: string
        method:
          type: string
          default: GET

ServerResponse:
  type: object
  required:
    - data
  properties:
    data:
      $ref: "#/ServerObject"

ServerListResponse:
  type: object
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: "#/ServerObject"
    meta:
      $ref: "./common.yaml#/PaginationMeta"

ServerCountResponse:
  type: object
  required:
    - total
    - online
    - offline
  properties:
    total:
      type: integer
    online:
      type: integer
    offline:
      type: integer
